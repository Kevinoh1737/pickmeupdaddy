          type: integer
        fromUserName:
          type: string
        toEmail:
          type: string
        status:
          type: string
          enum: [pending, accepted, declined]
        token:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - fromUserId
        - fromUserName
        - toEmail
        - status
        - createdAt

    InvitePreview:
      type: object
